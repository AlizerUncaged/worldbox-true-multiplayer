<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WorldBox Multiplayer · Server admin</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body class="min-h-screen bg-page font-sans text-ink antialiased dark:bg-night dark:text-white">

  <!-- Sign in -->
  <main id="login" class="hidden min-h-screen place-items-center p-6">
    <form id="login-form" class="card w-full max-w-sm p-8">
      <img src="/assets/logo.png" alt="" class="size-14">
      <h1 class="mt-5 text-2xl font-bold tracking-tight">Server admin</h1>
      <p class="mt-1 text-sm text-muted">WorldBox Multiplayer</p>
      <label class="label mt-7" for="login-user">Username</label>
      <input id="login-user" class="field" autocomplete="username" value="admin" required>
      <label class="label mt-4" for="login-pass">Password</label>
      <input id="login-pass" class="field" type="password" autocomplete="current-password" required>
      <p id="login-error" class="mt-3 hidden text-sm font-medium text-rose-500"></p>
      <button class="btn-primary mt-6 w-full py-2.5">Sign in</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="hidden min-h-screen lg:flex">
    <aside class="flex shrink-0 flex-col gap-1 p-4 lg:sticky lg:top-0 lg:h-screen lg:w-64">
      <div class="mb-6 flex items-center gap-3 px-2 pt-2">
        <img src="/assets/logo.png" alt="" class="size-10">
        <div class="leading-tight">
          <div class="text-sm font-bold">WorldBox Multiplayer</div>
          <div class="text-xs text-muted">Server admin</div>
        </div>
      </div>
      <nav class="flex gap-1 overflow-x-auto lg:flex-col">
        <button class="nav-item" data-view="overview"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Overview</button>
        <button class="nav-item" data-view="players"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/></svg>Online now</button>
        <button class="nav-item" data-view="accounts"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17c.6-1.8 1.9-2.7 3.5-2.7s2.9.9 3.5 2.7M15 10h3.5M15 13.5h3.5"/></svg>Accounts</button>
        <button class="nav-item" data-view="rooms"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 4l9 6.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Rooms</button>
        <button class="nav-item" data-view="bans"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></svg>Bans</button>
        <button class="nav-item" data-view="settings"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/></svg>Settings</button>
      </nav>
      <div class="mt-auto hidden flex-col gap-1 lg:flex">
        <button class="nav-item" id="theme-toggle"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span id="theme-label">Dark mode</span></button>
        <button class="nav-item" id="sign-out"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</button>
      </div>
    </aside>

    <main class="min-w-0 flex-1 p-4 lg:p-8 lg:pl-4">
      <div class="mx-auto max-w-6xl">
        <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
          <div>
            <p class="text-sm font-medium text-muted" id="view-kicker"></p>
            <h1 class="mt-1 text-3xl font-bold tracking-tight lg:text-4xl" id="view-title"></h1>
          </div>
          <div class="flex items-center gap-2 text-xs text-muted" id="live">
            <span class="relative flex size-2"><span class="absolute inline-flex size-full animate-ping rounded-full bg-emerald-400 opacity-60"></span><span class="relative inline-flex size-2 rounded-full bg-emerald-500"></span></span>
            <span id="live-text">Live</span>
          </div>
        </header>
        <section id="view"></section>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-40 hidden place-items-center bg-black/30 p-4 backdrop-blur-sm">
    <form id="modal-form" class="card w-full max-w-md p-6 shadow-pop">
      <h2 id="modal-title" class="text-lg font-bold tracking-tight"></h2>
      <p id="modal-text" class="mt-1 text-sm text-muted"></p>
      <div id="modal-body" class="mt-5 space-y-4"></div>
      <div class="mt-6 flex justify-end gap-2">
        <button type="button" class="btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn-primary" id="modal-ok">Confirm</button>
      </div>
    </form>
  </div>

  <div id="toasts" class="fixed right-4 bottom-4 z-50 flex flex-col gap-2"></div>
</body>
</html>
